plugins {
    id "architectury-plugin" version "3.5-SNAPSHOT"
    id "dev.architectury.loom-no-remap" version "1.14-SNAPSHOT" apply false
    id "me.modmuss50.mod-publish-plugin" version "2.2.0" apply false
}

architectury {
    minecraft = rootProject.minecraft_version
}

subprojects {
    apply plugin: "dev.architectury.loom-no-remap"
    apply plugin: "me.modmuss50.mod-publish-plugin"

    repositories {
        maven { url "https://maven.shedaniel.me/" }
        maven { url "https://maven.pitan76.net/" }
        maven { url "https://maven.neoforged.net/releases/" }
    }

    dependencies {
        minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
    }

    afterEvaluate {
        publishMods {
            if (name == "common") return

            file = tasks.named("shadowJar").flatMap { it.archiveFile }
            version = rootProject.mod_version
            displayName = "${rootProject.archives_base_name}-${project.name}-${rootProject.mod_version}.jar"
            changelog = rootProject.changelog

            type = STABLE
            modLoaders.add(name)

            var curseforgeToken = providers.environmentVariable("CURSEFORGE_TOKEN")
            var modrinthToken = providers.environmentVariable("MODRINTH_TOKEN")

            if (curseforgeToken.isPresent()) {
                curseforge {
                    accessToken = curseforgeToken
                    projectId = "973764"

                    minecraftVersions.addAll(['26.1', '26.1.1', '26.1.2', '26.2'])

                    client = true
                    server = true
                }
            }

            if (modrinthToken.isPresent()) {
                modrinth {
                    accessToken = modrinthToken
                    projectId = "YvaL4yx6"

                    minecraftVersions.addAll(['26.1', '26.1.1', '26.1.2', '26.2'])
                }
            }
        }
    }
}

allprojects {
    apply plugin: "java"
    apply plugin: "architectury-plugin"
    apply plugin: "maven-publish"

    base.archivesName = rootProject.archives_base_name
    version = rootProject.mod_version
    group = rootProject.maven_group

    repositories {
        // Add repositories to retrieve artifacts from in here.
        // You should only use this when depending on other mods because
        // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
        // See https://docs.gradle.org/current/userguide/declaring_repositories.html
        // for more information about repositories.
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = "UTF-8"
        options.release = 25
        sourceCompatibility = JavaVersion.VERSION_25
        targetCompatibility = JavaVersion.VERSION_25
    }

    java {
        withSourcesJar()
    }
}
